version: 0.4-cvrp-r12-post-r11-autonomous
case_aggregation: paired_effect_median
case_equivalence_band: 0.0

screening:
  n_cases_modify: 3
  n_cases_create: 3
  n_seeds: 2
  expand_n_seeds: 4
  expand_to_modify: 6
  expand_to_create: 6
  priority_case_ids:
    - cvrplib/B/B-n34-k5.vrp
    - cvrplib/tai/tai100a.vrp
    - cvrplib/X/X-n351-k40.vrp
  require_expanded_for_pass: true

validation:
  n_cases: 6
  n_seeds: 2
  expand_to: 6

frozen:
  n_cases: 12
  n_seeds: 2

canary:
  cases:
    - controlled/data/synthetic_controlled_canary_5.vrp
  seeds:
    - 110119

runtime:
  max_runtime_ratio: 2.0
  tie_speedup_ratio: 0.75
  tie_min_runtime_pairs: 1
  time_limits:
    stage_defaults:
      canary: 10
      screening: 60
      validation: 60
      frozen: 60
    rules:
      - stages:
          - screening
          - validation
          - frozen
        min_dimension: 101
        max_dimension: 200
        time_limit_sec: 90
      - stages:
          - screening
          - validation
          - frozen
        min_dimension: 201
        max_dimension: 350
        time_limit_sec: 120
      - stages:
          - screening
          - validation
          - frozen
        min_dimension: 351
        max_dimension: 700
        time_limit_sec: 180
      - stages:
          - screening
          - validation
          - frozen
        min_dimension: 701
        max_dimension: 1001
        time_limit_sec: 240
      # The tai100 names encode 100 customers plus the depot, while the
      # instance DIMENSION is 101. Preserve the dimension-based band, doubled uniformly to 90s.
      - stages:
          - screening
          - validation
          - frozen
        case_globs:
          - cvrplib/tai/tai100a.vrp
          - tai100a.vrp
        time_limit_sec: 90

gates:
  screening:
    win_rate_min: 0.6
    median_delta_min: practical_delta_screen
    bootstrap_ci_low_min: 0.0
    min_net_case_score: 0.25
    max_case_loss_rate: 0.2
    initial_quality_expansion:
      min_net_case_score: 0.125
      max_case_loss_rate: 0.25
      require_ci_high_at_practical_delta: true
  validation:
    win_rate_min: 0.66
    median_delta_min: practical_delta_validate
    bootstrap_ci_low_min: 0.0
    bootstrap_n: 1000
    min_net_case_score: 0.25
    max_case_loss_rate: 0.2
  frozen:
    bootstrap_ci_low_min: 0.0
    canary_required: true
    min_net_case_score: 0.25
    max_case_loss_rate: 0.2
