spec_version: "problem-v1"

id: warehouse_delivery
display_name: "Warehouse Delivery Assignment"
root_dir: /home/clawd/research/or-autoresearch-agent/surrogate
description: >-
  Warehouse Delivery Assignment: assign B2B orders to a fleet of vehicle slots
  for last-mile logistics. Objective (lexicographic): minimise subcategory_splits
  first, then total_cost. This is NOT a routing problem — it is a multi-attribute
  generalised assignment / bin-packing problem.

operators_dir: operators
data_dir: data
oracle_path: oracle.py
solver_path: solver.py
canary_case_path: /home/clawd/research/or-autoresearch-agent/surrogate/data/instance_small_1.json
unit_test_path: tests/test_operators.py
regression_test_path: tests/test_solver.py

search_space:
  editable:
    - "operators/*.py"
  frozen:
    - "solver.py"
    - "vns.py"
    - "pool.py"
    - "models.py"
    - "config.py"
    - "oracle.py"
    - "greedy_init.py"
    - "operators/base.py"
    - "operators/__init__.py"
  import_whitelist:
    - __future__
    - math
    - random
    - copy
    - typing
    - dataclasses
    - operators
    - itertools
    - functools
    - collections
    - enum
    - abc
    - models

solver:
  time_limit_sec: 300
  max_iter: 200

parameter_search:
  enabled: true
  trigger: on_promote
  target: operator_weights
  strategy: random_local
  n_initial_random: 8
  n_iterations: 16
  n_eval_seeds: 2
  weight_bounds: [0.05, 5.0]

operator_interface:
  base_class_import: "operators.base:Operator"
  execute_signature: "execute(self, solution, rng) -> Solution"
  categories:
    - name: order_level
      description: "Operators that move/swap individual orders between vehicles"
    - name: vehicle_level
      description: "Operators that merge, split, or restructure entire vehicles"

research_surfaces:
  - name: order_level
    kind: operator
    description: "Warehouse operators that move or swap individual orders between vehicles."
    targets:
      files:
        - "operators/*.py"
      create_new_allowed: true
      modify_allowed: true
      remove_allowed: true
      singleton: false
    prompt:
      hypothesis_guidance: >-
        Order-level and swap-style hypotheses must be selective and bounded:
        target a named consolidation or cost-preserving gap, pre-filter by
        compatible vehicle category, region, subcategory, capacity slack, or
        cost delta, and state the top-k, sampling, or early-exit cap that keeps
        runtime comparable to the champion.
      implementation_guidance: >-
        An order-level operator may be invoked repeatedly inside the search
        loop. Precompute vehicle/order summaries once per execute call, inspect
        only a bounded candidate set, deep-copy only after a viable move is
        selected, and return the original solution when no safe move exists.
        Avoid repeated full-solution feasibility/objective recomputation inside
        nested candidate loops.
      anti_patterns: >-
        Do not scan every vehicle pair and every order pair without a cap, do
        not clone the whole solution for each trial pair, and do not perform a
        broad swap_orders rewrite that relies on O(n^2) trial evaluation or
        heavy recomputation on small canary cases.
  - name: vehicle_level
    kind: operator
    description: "Warehouse operators that merge, split, resize, or rebuild vehicle assignments."
    targets:
      files:
        - "operators/*.py"
      create_new_allowed: true
      modify_allowed: true
      remove_allowed: true
      singleton: false
    prompt:
      hypothesis_guidance: >-
        Vehicle-level hypotheses must name the structural assignment invariant
        they preserve. Removing, disabling, or replacing split/merge operators
        such as split_vehicle.py or merge_vehicles.py is allowed only when the
        hypothesis states an explicit replacement path that keeps every order
        assigned exactly once and keeps Solution.assignment synchronized with
        Vehicle.order_ids after every move.
      implementation_guidance: >-
        Structural vehicle operators must update both vehicle.order_ids and
        solution.assignment together, preserve locked orders, call
        remove_empty_vehicles after moves, and return the original solution
        when the replacement path cannot prove capacity, region, category,
        pickup, hazard, and assignment completeness constraints.
      anti_patterns: >-
        Do not delete, disable, or neuter split/merge behavior merely because a
        prior branch failed. Do not remove operators/split_vehicle.py or an
        equivalent structural vehicle split/merge path without an explicit
        assignment-completeness check, a synchronized reassignment plan, and a
        replacement mechanism that preserves all orders.

objective_policy:
  mode: lexicographic
  expose_weights_to_llm: false

objectives:
  - name: subcategory_splits
    direction: minimize
    priority: 1
    tie_tolerance: 0
  - name: total_cost
    direction: minimize
    priority: 2
    tie_tolerance: 0

measurement:
  runtime_model: comparative
  pairing_validity: trajectory_divergent
  effect_scale:
    metric: total_cost
    unit: raw_delta
    practical_delta_screen: 0.001
    practical_delta_validate: 0.001
  calibration_ref: calibration/aa_noise_floor.json
  calibration_max_age_days: 90

llm_hints:
  problem_summary: >-
    Vehicle assignment problem with subcategory consolidation.
    NOT a routing/TSP problem. No distance matrix.
  operator_interface: >-
    Operators subclass operators.base.Operator and implement
    execute(self, solution, rng) -> Solution.

family_taxonomy:
  version: "warehouse-delivery-v1"
  families:
    - destroy_rebuild
    - subcategory_consolidation
    - order_swap
    - rebalance
    - split_operator
    - cost_reduction
    - intra_subcat_repack
    - vehicle_elimination
  aliases:
    destroy_rebuild:
      - destroy
      - rebuild
      - destroy and rebuild
    subcategory_consolidation:
      - subcategory
      - subcategories
      - subcategor
      - consolidate
      - consolidation
      - merge subcategory
      - subcategory merge
      - subcategory swap
    order_swap:
      - swap
      - swap orders
      - order swap
      - reassign orders
      - order level
      - order_level
      - exchange orders
    rebalance:
      - rebalance
      - redistribute
    split_operator:
      - split
    cost_reduction:
      - cost
      - reduce cost
      - downsize
      - downsizing
      - vehicle type
      - upgrade
    intra_subcat_repack:
      - drain
      - evacuate
      - evict
      - purify
      - repack
    vehicle_elimination:
      - eliminate vehicle
      - eliminate weak vehicles
      - remove vehicle
      - remove_vehicle
      - kill vehicle

adapter:
  import_path: "scion.problems.warehouse_delivery.adapter:WarehouseDeliveryAdapter"
  api_version: "v1"
