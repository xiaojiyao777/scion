version: "0.4-cvrp-controlled-smoke"

screening:
  n_cases_modify: 12
  n_cases_create: 12
  n_seeds: 1
  expand_to_modify: 12
  expand_to_create: 12

validation:
  n_cases: 8
  n_seeds: 2
  expand_to: 8

frozen:
  n_cases: 8
  n_seeds: 2
  max_uses_per_campaign: 1

canary:
