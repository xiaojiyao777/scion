version: 0.4-cvrp-formal-readiness
screening:
  n_cases_modify: 8
  n_cases_create: 12
  n_seeds: 4
  expand_to_modify: 12
  expand_to_create: 16
  priority_case_ids:
  - cvrplib/CMT/CMT2.vrp
  - cvrplib/CMT/CMT4.vrp
validation:
  n_cases: 8
  n_seeds: 4
  expand_to: 12
frozen:
  n_cases: 8
  n_seeds: 3
canary:
  cases:
  - controlled/data/synthetic_controlled_canary_5.vrp
  seeds:
  - 101
runtime:
  max_runtime_ratio: 2.0
  tie_speedup_ratio: 0.75
  tie_min_runtime_pairs: 1
  time_limits:
    stage_defaults:
      canary: 10
      screening: 30
      validation: 30
      frozen: 60
    rules:
    - stages:
      - screening
      case_globs:
      - cvrplib/CMT/CMT4.vrp
      - CMT4.vrp
      time_limit_sec: 45
    - stages:
      - screening
      min_dimension: 150
      max_dimension: 250
      time_limit_sec: 45
    - stages:
      - screening
      min_dimension: 251
      time_limit_sec: 60
    - stages:
      - validation
      min_dimension: 101
      max_dimension: 149
      time_limit_sec: 45
    - stages:
      - validation
      min_dimension: 150
      max_dimension: 250
      time_limit_sec: 60
    - stages:
      - validation
      min_dimension: 251
      time_limit_sec: 90
    - stages:
      - frozen
      min_dimension: 251
      max_dimension: 500
      time_limit_sec: 90
    - stages:
      - frozen
      min_dimension: 501
      time_limit_sec: 120
gates:
  screening:
    win_rate_min: 0.6
    median_delta_min: practical_delta_screen
    expanded_borderline_advance:
      enabled: true
      win_rate_window: 0.10
      require_median_delta_nonnegative: true
      require_ci_low_nonnegative: true
      allow_pair_level_signal: true
      pair_win_rate_min: 0.50
      min_pair_total: 16
      min_pair_wins: 8
      min_pair_win_loss_margin: 1
      pair_non_tie_win_rate_min: 0.60
      max_pair_loss_rate: 0.40
  validation:
    win_rate_min: 0.66
    median_delta_min: practical_delta_validate
    bootstrap_ci_low_min: 0.0
    bootstrap_n: 1000
  frozen:
    bootstrap_ci_low_min: 0.0
    canary_required: true
