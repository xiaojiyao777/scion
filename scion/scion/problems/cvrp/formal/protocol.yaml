version: 0.4-cvrp-v3-quality-screen-r2
case_aggregation: paired_effect_median
case_equivalence_band: 0.0
screening:
  n_cases_modify: 8
  n_cases_create: 8
  n_seeds: 4
  expand_n_seeds: 8
  expand_to_modify: 12
  expand_to_create: 12
  require_expanded_for_pass: true
validation:
  n_cases: 12
  n_seeds: 4
  expand_to: 12
frozen:
  n_cases: 12
  n_seeds: 3
canary:
  cases:
  - controlled/data/synthetic_controlled_canary_5.vrp
  seeds:
  - 101
runtime:
  max_runtime_ratio: 2.0
  tie_speedup_ratio: 0.75
  tie_min_runtime_pairs: 1
  time_limits:
    stage_defaults:
      canary: 10
      screening: 30
      validation: 30
      frozen: 60
    rules:
    - stages:
      - screening
      case_globs:
      - cvrplib/CMT/CMT4.vrp
      - CMT4.vrp
      time_limit_sec: 45
    - stages:
      - screening
      min_dimension: 150
      max_dimension: 250
      time_limit_sec: 45
    - stages:
      - screening
      min_dimension: 251
      time_limit_sec: 60
    - stages:
      - validation
      min_dimension: 101
      max_dimension: 149
      time_limit_sec: 45
    - stages:
      - validation
      min_dimension: 150
      max_dimension: 250
      time_limit_sec: 60
    - stages:
      - validation
      min_dimension: 251
      time_limit_sec: 90
    - stages:
      - frozen
      min_dimension: 251
      max_dimension: 500
      time_limit_sec: 90
    - stages:
      - frozen
      min_dimension: 501
      time_limit_sec: 120
gates:
  screening:
    win_rate_min: 0.6
    median_delta_min: practical_delta_screen
  validation:
    win_rate_min: 0.66
    median_delta_min: practical_delta_validate
    bootstrap_ci_low_min: 0.0
    bootstrap_n: 1000
  frozen:
    bootstrap_ci_low_min: 0.0
    canary_required: true
